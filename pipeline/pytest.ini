[pytest]
testpaths = tests
# The audit builds all sixteen dwellings in the demo drawing and takes a few minutes,
# which is too slow to sit in the loop a developer runs on every edit. It is excluded by
# default and run explicitly with `-m slow` (or in CI), so the fast suite stays fast
# without the slow one quietly never running.
addopts = -m "not slow"
markers =
    slow: builds every dwelling in a real drawing; minutes, not seconds
